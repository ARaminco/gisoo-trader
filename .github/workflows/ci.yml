# Unit tests for the engine and a type-checked build of the panel.
# No exchange, LLM or FX keys are used: every test stubs the network.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trader/engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trader/engine/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app tests
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trader/panel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: trader/panel/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.vps.yml config --quiet
