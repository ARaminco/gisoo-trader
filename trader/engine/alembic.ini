# Alembic configuration for the trading engine's database schema.
#
# Revisions live in ./alembic/versions. The database URL is deliberately NOT
# set here: alembic/env.py takes it from the app settings (DATABASE_URL), the
# same value every worker uses.
#
# Day to day you never call alembic directly - the `migrate` compose service
# runs `python -m app.db.migrate`, which runs `alembic upgrade head` when
# revisions exist (see alembic/README.md).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-7s [%(name)s] %(message)s
