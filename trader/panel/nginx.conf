server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;

    # hashed assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # the service worker must never be cached
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # the shell must always be revalidated or an installed app keeps an old build
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # icons change rarely; a week keeps Cloudflare and the phone from refetching
    location ~* \.(png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
